function buildReal(){
 const PM={},pairs=[],matches=[],tournaments=[];
 const cap=s=>s.toLowerCase().replace(/(^|\s|-)\S/g,x=>x.toUpperCase());
 const pid=n=>{const k=n.replace(/\*/g,'').replace(/\s*\/\s*/g,' / ').replace(/\s+/g,' ').trim(),id=norm(k).replace(/[^a-z0-9]+/g,'_');if(!PM[id]){PM[id]={id,name:k.split(' / ').map(cap).join(' – ')};pairs.push(PM[id])}return id};
 const sets=s=>s?s.split(',').map(x=>x.split('-').map(Number)):[];
 const mk=(t,a,b,k,time,s)=>{const st=sets(s),w=st.reduce((r,x)=>r+(x[0]>x[1]?1:-1),0);matches.push({id:t.id+'_'+k,tid:t.id,date:t.date,league:t.lg,a,b,order:k,time,sets:st,status:st.length?'played':'scheduled',winner:st.length?(w>0?a:b):null})};
 const O=[[2,3],[1,4],[1,2],[3,4],[1,3],[2,4]],O6=[[2,5],[3,4],[1,2],[3,5],[1,3],[4,5],[1,4],[2,3],[1,5],[2,4]],TG=['9:00','9:40','10:20','11:00','11:40','12:20'],TT=['13:00','13:00','13:40','13:40','14:20','14:20','14:40','14:40'];
 SNAP.forEach((Z,i)=>{
  const t={id:'t'+i,lg:Z.lg,date:Z.date,name:(Z.rd||1)+'. krog',played:!!Z.x,groups:[],results:{}},al={};
  ['A','B'].forEach(g=>{const ids=Z[g].split('|').map(pid),o=ids.length>4?O6:O,rs=(Z['r'+g]||'').split(';');
   ids.forEach((id,j)=>al[g.toLowerCase()+(j+1)]=id);
   t.groups.push({league:Z.lg,grp:g,ids,ordered:null});
   o.forEach(([x,y],k)=>mk(t,ids[x-1],ids[y-1],k,ids.length>4?`${9+(k>>1)}:${k%2?'30':'00'}`:TG[k],rs[k]))});
  (Z.x||'').split(';').filter(Boolean).forEach((e,k)=>{const[a,b,s]=e.split(' ');mk(t,al[a],al[b],20+k,TT[k],s)});
  (Z.R||'').split(',').filter(Boolean).forEach(e=>{const[a,r]=e.split(' '),rk=+r,lv=parseInt(Z.lg);t.results[al[a]]={league:Z.lg,rank:rk,move:rk<=2&&lv>1?'up':(rk>=7||(lv==1&&rk>=5))?'down':'same'}});
  tournaments.push(t)});
 tournaments.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);

function buildFromSheets(docs){

 const isP=s=>typeof s==='string'&&s.includes('/'),num=v=>v===''||v==null||isNaN(+v)?null:+v;
 docs.forEach(doc=>doc.tabs.forEach(tab=>{

/* ============ statistics.js ============ */
const pc=(a,b)=>b?Math.round(100*a/b):null,F=v=>v==null?'Ni podatkov':v+' %';
const zm=n=>n==1?'zmago':n==2?'zmagi':n<5&&n>0?'zmage':'zmag';
let D=null;const P=id=>D.pairs.find(p=>p.id===id);
const played=id=>D.matches.filter(m=>m.status==='played'&&m.sets.length&&(m.a===id||m.b===id)).sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:x.order-y.order);
const view=(m,id)=>{const f=m.a===id;return{m,opp:f?m.b:m.a,sets:m.sets.map(s=>f?s:[s[1],s[0]]),win:m.winner===id}};
function curLeague(id){for(let i=D.tournaments.length-1;i>=0;i--){const g=D.tournaments[i].groups.find(g=>g.ids.includes(id));if(g)return g.league}return null}
const lvl=l=>7-parseInt(l);
function stats(id){
 const ms=played(id).map(m=>view(m,id)),o={n:ms.length,w:0,l:0,sw:0,sl:0,ms,ps:[0,1,2].map(()=>({n:0,w:0,pf:0,d:0})),c:{w20:0,w21:0,l02:0,l12:0,comeW:0,lostAfter:0}};
 let cur=0,mw=0,ml=0;
 ms.forEach(v=>{v.win?(o.w++,cur=cur>0?cur+1:1):(o.l++,cur=cur<0?cur-1:-1);mw=Math.max(mw,cur);ml=Math.max(ml,-cur);
  if(v.sets.length<2)return; /* en set do 15 (tekme za mesta) ne štejejo v statistiko setov */
  v.sets.forEach((s,i)=>{const p=o.ps[i];p.n++;p.pf+=s[0];p.d+=s[0]-s[1];s[0]>s[1]?(p.w++,o.sw++):o.sl++});
  const k=v.sets.length,f=v.sets[0];
  if(v.win){k==2?o.c.w20++:o.c.w21++;if(f[0]<f[1])o.c.comeW++}else{k==2?o.c.l02++:o.c.l12++;if(f[0]>f[1])o.c.lostAfter++}});
 o.maxW=mw;o.maxL=ml;o.form=ms.slice(-5).map(v=>v.win);o.pct=pc(o.w,o.n);o.setPct=pc(o.sw,o.sw+o.sl);return o}
function h2h(a,b){const ms=played(a).filter(m=>m.a===b||m.b===b).map(m=>view(m,a));return{n:ms.length,w:ms.filter(v=>v.win).length,ms}}
function moves(id){return D.tournaments.filter(t=>t.results[id]).map(t=>t.results[id].move)}
function patterns(id){
 const s=stats(id),r=[];if(s.n<2)return['Premalo odigranih tekem za analizo vzorcev.'];
 const f=s.form.filter(Boolean).length;r.push(`V zadnjih ${s.form.length} tekmah je zabeležil ${f} ${zm(f)}.`);
 const l10=s.ms.filter(v=>v.sets.length>1).slice(-10);if(l10.length>=5){const x=l10.filter(v=>v.sets[0][0]>v.sets[0][1]).length;r.push(`Dobil je ${x} od zadnjih ${l10.length} prvih setov.`)}
 if(s.ps[2].n>=2)r.push(`V odločilnem tretjem setu je uspešen v ${pc(s.ps[2].w,s.ps[2].n)} % primerov (${s.ps[2].w} od ${s.ps[2].n}).`);
 if(s.c.lostAfter>0)r.push(`Po dobljenem prvem setu je tekmo izgubil ${s.c.lostAfter}-krat.`);
 if(s.c.comeW>0)r.push(`Po izgubljenem prvem setu je tekmo obrnil ${s.c.comeW}-krat.`);
 const mv=moves(id),up=mv.filter(x=>x==='up').length,dn=mv.filter(x=>x==='down').length;
 if(mv.length)r.push(`Na ${mv.length} ${mv.length==1?'turnirju':'turnirjih'} je napredoval ${up}-krat in izpadel ${dn}-krat.`);
 return r}
function predict(a,b){
 const A=stats(a),B=stats(b),H=h2h(a,b);if(A.n<3||B.n<3)return null;
 const sh=(w,n)=>(w+2)/(n+4),fm=s=>(s.form.filter(Boolean).length+1)/(s.form.length+2),sr=s=>(s.sw+2)/(s.sw+s.sl+4);
 const dF=fm(A)-fm(B),dR=sh(A.w,A.n)-sh(B.w,B.n),dS=sr(A)-sr(B),dL=lvl(curLeague(a))-lvl(curLeague(b));
 const dH=H.n?(H.w-(H.n-H.w))/H.n*Math.min(H.n,3)/3:0;
 const z=3*(.4*dF+.35*dR+.25*dS)+.3*dL+.6*dH,p=Math.min(85,Math.max(15,Math.round(100/(1+Math.exp(-z)))));
 const why=[];
 why.push(dF>.1?`${P(a).name} ima boljšo formo.`:dF<-.1?`${P(b).name} ima boljšo formo.`:'Obe pari imata primerljivo formo.');
 const t3=s=>s.ps[2].n>=2?s.ps[2].w/s.ps[2].n:null,ta=t3(A),tb=t3(B);
 if(ta!=null&&tb!=null&&Math.abs(ta-tb)>.2)why.push(`${ta>tb?P(a).name:P(b).name} je uspešnejši v odločilnih tretjih setih.`);
 if(dL)why.push(`${dL>0?P(a).name:P(b).name} igra v višji ligi.`);
 if(H.n)why.push(`Medsebojni izid: ${H.w}:${H.n-H.w}.`);
 return{p,why:why.join(' '),basis:Math.min(A.n,B.n)}}

function predCard(a,b,pr){
 if(!pr)return`<div class="card">${empty('Premalo podatkov za zanesljivo napoved.')}</div>`;
 return`<div class="card"><div class="vs"><div><div class="big">${pr.p} %</div><div class="sm">${nm(a)}</div></div><span class="mut">:</span><div><div class="big" style="color:var(--tx)">${100-pr.p} %</div><div class="sm">${nm(b)}</div></div></div><p style="margin-top:12px">${pr.why}</p><p class="sm mut" style="margin-top:8px">Informativna statistična ocena (forma, skupna uspešnost, uspešnost po setih, liga, medsebojni izidi; osnova: ${pr.basis}+ tekem). Ni zagotovljen izid.</p></div>`}

function vCompare(){
 const a=S.ca||S.me,b=S.cb||D.pairs.find(p=>p.id!==a).id,sa=stats(a),sb=stats(b),H=h2h(a,b);
 const sel=(k,v)=>`<select data-cmp="${k}">${D.pairs.map(p=>`<option value="${p.id}" ${p.id===v?'selected':''}>${p.name}</option>`).join('')}</select>`;
 const bar=(l,x,y,fx,fy)=>{const t=(x||0)+(y||0),w=t?Math.round(100*(x||0)/t):50;return`<div class="bar"><div style="text-align:right"><b>${fx}</b></div><div><div class="sm mut" style="text-align:center">${l}</div><div class="t"><i style="width:${w}%;background:var(--ac)"></i><i style="width:${100-w}%;background:#5b7cb0"></i></div></div><div><b>${fy}</b></div></div>`};
 const t3=s=>pc(s.ps[2].w,s.ps[2].n),pct=s=>s.pct,P1=s=>pc(s.ps[0].w,s.ps[0].n),P2=s=>pc(s.ps[1].w,s.ps[1].n),ups=id=>moves(id).filter(x=>x==='up').length;
 const B=(l,f)=>bar(l,f(sa),f(sb),F(f(sa)),F(f(sb)));
 return`<h1>Primerjava parov</h1><div class="flt" style="margin-top:12px">${sel('a',a)}<span class="mut">vs.</span>${sel('b',b)}</div>`+
 (a===b?`<div class="card">${empty('Izberi dva različna para.')}</div>`:
 `<div class="card"><div class="vs"><div><b>${nm(a)}</b><br><span class="pill ac">${curLeague(a)}</span></div><span class="mut">VS.</span><div><b>${nm(b)}</b><br><span class="pill ac">${curLeague(b)}</span></div></div>`+
 bar('Odigrane tekme',sa.n,sb.n,sa.n,sb.n)+bar('Zmage',sa.w,sb.w,sa.w,sb.w)+B('Odstotek zmag',pct)+B('1. set',P1)+B('2. set',P2)+B('3. set',t3)+bar('Forma (zmage v zadnjih 5)',sa.form.filter(Boolean).length,sb.form.filter(Boolean).length,formPills(sa.form),formPills(sb.form))+bar('Napredovanja',ups(a),ups(b),ups(a),ups(b))+`</div>`+
 `<h2>Medsebojni dvoboji</h2><div class="card">${H.n?`<p>Pomerila sta se ${H.n}×: ${H.w} : ${H.n-H.w}. Zadnje srečanje: ${fd(H.ms[H.n-1].m.date)}.</p>`+H.ms.map(v=>`<div class="row"><div>${fd(v.m.date)} · ${sc(v)}</div><span class="${v.win?'W':'L'}">${v.win?nm(a):nm(b)}</span></div>`).join(''):empty('Para se v razpoložljivih podatkih še nista pomerila.')}</div><h2>Statistična napoved</h2>${predCard(a,b,predict(a,b))}`)}

function vMine(){return head(S.me)+`<button class="btn pri" data-act="change">Zamenjaj par</button><h2>Poglej drug par</h2>${searchBox('view')}<h2>Podatki</h2><div class="card sm mut">Vir: ${CFG.SOURCE==='snapshot'?'posnetek preglednic (19. 10. 2026)':'Google Sheets'}. Samodejno osveževanje vsakih ${CFG.REFRESH_MIN} min.</div>`}

function after(){
 const id=S.v==='opp'?S.pid:S.me;
 if(S.v==='mine')suggest('view','');
 if($('#prog')){
  const ts=D.tournaments,ys=ts.map(t=>{const g=t.groups.find(g=>g.ids.includes(id));return g?lvl(g.league):null}),v=ys.filter(y=>y!=null);
  if(!v.length){$('#prog').closest('.card').innerHTML=empty('Ni podatkov o ligah.');return}
  const col=ts.map(t=>!t.played?'#8ea0ba':t.results[id]?.move==='up'?'#3fdc86':t.results[id]?.move==='down'?'#ff5d6e':'#b8f23c');
  charts.push(new Chart($('#prog'),{type:'line',data:{labels:ts.map(t=>new Date(t.date).toLocaleDateString('sl-SI',{day:'numeric',month:'numeric'})),datasets:[{data:ys,stepped:true,borderColor:'#b8f23c',pointBackgroundColor:col,pointRadius:7,pointHoverRadius:9,borderWidth:2}]},
   options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>(7-c.raw)+'. liga'}}},
    scales:{y:{min:Math.min(...v)-1,max:Math.max(...v)+1,ticks:{stepSize:1,color:'#8ea0ba',callback:x=>x>=1&&x<=6?(7-x)+'. liga':''},grid:{color:'#26395a'}},x:{ticks:{color:'#8ea0ba'},grid:{display:false}}},
    onClick:(e,el)=>{if(!el.length)return;const t=ts[el[0].index],r=t.results[id],ms=D.matches.filter(m=>m.tid===t.id&&m.status==='played'&&(m.a===id||m.b===id)).map(m=>view(m,id));
     $('#pd').innerHTML=`<b style="color:var(--tx)">${fd(t.date)}</b> · liga ${(t.groups.find(g=>g.ids.includes(id))||{}).league}`+(t.played?` · ${r.rank}. mesto · ${r.move==='up'?'napredovanje':r.move==='down'?'izpad':'obstanek'}<br>`+ms.map(v=>`${nm(v.opp)}: ${sc(v)} (${v.win?'Z':'P'})`).join('<br>'):'<br>Turnir še ni odigran.')}}}))}
 if($('#setc')){const s=stats(id);charts.push(new Chart($('#setc'),{type:'bar',data:{labels:['1. set','2. set','3. set'],datasets:[{data:s.ps.map(p=>pc(p.w,p.n)),backgroundColor:'#b8f23c',borderRadius:6}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{min:0,max:100,ticks:{color:'#8ea0ba',callback:v=>v+' %'},grid:{color:'#26395a'}},x:{ticks:{color:'#8ea0ba'},grid:{display:false}}}}}))}}

document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='go')go(b.dataset.v,b.dataset.pid);
 if(a==='pick'){if(b.dataset.ctx==='me'){S.me=b.dataset.pid;localStorage.setItem('ludus_me',S.me);go('home')}else go('opp',b.dataset.pid)}
 if(a==='change'){localStorage.removeItem('ludus_me');S.me=null;render()}
 if(a==='refresh')refresh(true)});
document.addEventListener('input',e=>{if(e.target.dataset.search)suggest(e.target.dataset.search,e.target.value)});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.fl){S.fl[t.dataset.fl]=t.value;render()}
 if(t.dataset.cmp){S[t.dataset.cmp==='a'?'ca':'cb']=t.value;render()}});

async function refresh(manual){
 try{DataSource.stale=false;D=await DataSource.load();S.upd=new Date();S.err=DataSource.stale?'Podatkov ni bilo mogoče osvežiti.':null}catch(x){S.err=x.message||'Podatkov ni mogoče pridobiti.';if(!D)D=buildReal()}
 render()}
render();refresh();setInterval(refresh,CFG.REFRESH_MIN*60000);
</script>
</body>
</html>
